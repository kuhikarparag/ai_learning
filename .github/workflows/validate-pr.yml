name: Validate PR

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest

    strategy:
      matrix:
        language: [python, php, javascript]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        if: matrix.language == 'python'
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi

      - name: Run Python lint and tests
        if: matrix.language == 'python'
        run: |
          python -m flake8 .
          python -m unittest discover

      - name: Set up PHP
        if: matrix.language == 'php'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'

      - name: Run PHP lint and tests
        if: matrix.language == 'php'
        run: |
          php -l $(find . -name "*.php")
          if [ -f "phpunit.xml" ]; then ./vendor/bin/phpunit; fi

      - name: Set up Node.js
        if: matrix.language == 'javascript'
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install Node.js dependencies
        if: matrix.language == 'javascript'
        run: |
          if [ -f "package.json" ]; then npm install; fi

      - name: Run Node.js lint and tests
        if: matrix.language == 'javascript'
        run: |
          if [ -f "package.json" ]; then npm run lint && npm test; fi
